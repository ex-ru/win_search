name: Windows checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Unit and WPF regressions
        run: dotnet test port/WAI-5c5c1f3ae2b4346353e34704b4783956d1ae8c4f/windows/WAI.Windows.sln -c Release --logger trx --results-directory TestResults -warnaserror:NU1903,NU1904
      - name: Real file lifecycle and crash recovery
        run: dotnet run --project checks/WAI.ReleaseSmoke -c Release -- --report TestResults/lifecycle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks
          path: TestResults/
